services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reprato
      POSTGRES_PASSWORD: reprato_local_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - reprato-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reprato -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  reprato-postgres:
