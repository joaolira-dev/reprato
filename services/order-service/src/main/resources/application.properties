spring.application.name=reprato-orders
server.port=${PORT:18083}
server.address=${HOST:127.0.0.1}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55434/reprato_orders}
spring.datasource.username=${DATABASE_USER:reprato}
spring.datasource.password=${DATABASE_PASSWORD:reprato_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
reprato.catalog-url=${CATALOG_URL:http://localhost:18081}
reprato.inventory-url=${INVENTORY_URL:http://localhost:18082}
